[tools]
"github:DarkRader/macicon" = "0.3.1"

[settings.dotfiles]
root = "~/dotfiles"

[dotfiles]
"~/.config/gh/config.yml" = {}
"~/.config/gh/hosts.yml" = {}
"~/.config/openlogi/config.toml" = {}
"~/.config/starship.toml" = {}
"~/.config/vicinae/settings.json" = {}
"~/.config/zed/settings.json" = {}

"~/.warp/settings.toml" = {}
"~/.warp/themes" = {}
"~/.zsh" = {}
"~/.zshrc" = {}

# Dotfiles Tasks
[tasks.check]
description = "Run all repository health checks (dotfiles symlinks, nix flake, git diff)"
depends = ["dot:diff", "nix:check"]
run = "git diff --check"

[tasks."dot:apply"]
description = "Apply dotfile symlinks into home directory"
run = "mise dot apply"

[tasks."dot:diff"]
description = "Preview dotfile changes without writing"
run = "mise dot diff"

[tasks."dot:status"]
description = "Show status of managed dotfiles"
run = "mise dot status"

[tasks."dot:add"]
description = "Add and symlink a new dotfile into this repository"
run = "mise dot add -l"

[tasks."dot:unapply"]
description = "Remove dotfile symlinks from home directory"
run = "mise dot unapply"

# Macicon Tasks
[tasks.icon]
description = "Run macicon command"
run = "macicon"

[tasks."icon:sync"]
description = "Sync and regenerate missing icons across all themes in themes.json"
run = "macicon --sync-themes"

[tasks."icon:all"]
description = "Generate an icon across all registered themes"
run = "macicon --all-themes"

[tasks."icon:create-theme"]
description = "Batch generate all existing icons into a new theme folder"
run = "macicon --create-theme"

[tasks."icon:preview"]
description = "Generate an icon with a 1024x1024 PNG preview"
run = "macicon --preview"

# Nix Tasks
[tasks."nix:personal"]
description = "Rebuild and apply personal macOS configuration"
run = "sudo -H darwin-rebuild switch --flake ./nix#macbook-personal"
alias = "darwin:personal"

[tasks."nix:work"]
description = "Rebuild and apply work macOS configuration"
run = "sudo -H darwin-rebuild switch --flake ./nix#macbook-work"
alias = "darwin:work"

[tasks."nix:check"]
description = "Verify flake evaluation across configurations"
run = "nix flake check ./nix"
alias = "darwin:check"

[tasks."nix:build"]
description = "Build personal configuration without activating"
run = "darwin-rebuild build --flake ./nix#macbook-personal"

[tasks."nix:update"]
description = "Update nix flake lockfile dependencies"
run = "nix flake update --flake ./nix"

[tasks."nix:gc"]
description = "Clean up old generations and garbage collect nix store"
run = "nix-collect-garbage -d"
