# ~/.config/tmux/tmux.conf
# Managed declaratively via mise & dotfiles

# --- Usability & Performance ---
# Eliminate Escape key delay for Vim/Neovim
set -s escape-time 0

# Enable mouse support (clickable panes, drag-to-resize, scrolling)
set -g mouse on

# Start window and pane numbering at 1 (matches 1-9 keyboard number row)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- 24-bit Truecolor ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",alacritty:RGB"

# --- Darkrader Aesthetic (Status Bar & Styling) ---
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#191919,fg=#f1f1f1"

# Pane borders
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#28eaff"

# Session badge (left)
set -g status-left "#[bg=#28eaff,fg=#121212,bold] #S #[bg=default,fg=default] "
set -g status-left-length 30

# Date & time (right)
set -g status-right "#[fg=#9b28ff]󰃭 %Y-%m-%d #[fg=#28eaff]󱑎 %H:%M "
set -g status-right-length 50

# Window tabs
setw -g window-status-format "#[fg=#888888,bg=#191919] #I:#W "
setw -g window-status-current-format "#[fg=#121212,bg=#9b28ff,bold] #I #[fg=#f1f1f1,bg=#2a2a2a,bold] #W "
setw -g window-status-separator ""
