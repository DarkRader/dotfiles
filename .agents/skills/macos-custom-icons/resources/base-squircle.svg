<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="squircle-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="light-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EBECEF"/>
    </linearGradient>
    <linearGradient id="dark-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2B2E"/>
      <stop offset="100%" stop-color="#1C1D1F"/>
    </linearGradient>
  </defs>

  <!-- Light Squircle Base -->
  <rect x="96" y="88" width="832" height="832" rx="185" fill="url(#light-grad)" filter="url(#squircle-shadow)" stroke="#D8D9DC" stroke-width="1.5"/>
</svg>
